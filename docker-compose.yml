services:
  bff:
    build: .
    restart: unless-stopped
    environment:
      PORT_BFF: "4000"
      STUDIO_WEB_ORIGIN: https://${APP_DOMAIN}
      STUDIO_COOKIE_SECURE: "true"
      STUDIO_DEFAULT_PRESET_DIR: /data/presets/stable
    volumes:
      - ./.env:/app/.env:ro
      - ./envs:/app/envs:ro
      - ./presets:/data/presets
    ports:
      # Hanya loopback; akses publik lewat Tailscale Funnel
      - "127.0.0.1:4000:4000"
